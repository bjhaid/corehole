{{define "page.custom-dns"}}
        <section id="panel-custom-dns" class="page-panel" data-page="custom-dns">
        <div class="page-heading">
          <h3>Custom DNS</h3>
        </div>
        <section class="panel localdns-panel">
          <div class="panel-header">
            <h3>Local records</h3>
            <span id="localdns-status">--</span>
          </div>

          <div class="localdns-controls">
            <form id="localdns-form" class="control-box form-grid localdns-form">
              <input id="localdns-id" name="id" type="hidden">
              <div>
                <label for="localdns-name">Name</label>
                <input id="localdns-name" name="name" type="text" autocomplete="off" required>
              </div>
              <div>
                <label for="localdns-type">Type</label>
                <select id="localdns-type" name="type">
                  <option value="A">A</option>
                  <option value="AAAA">AAAA</option>
                  <option value="CNAME">CNAME</option>
                  <option value="PTR">PTR</option>
                </select>
              </div>
              <div>
                <label for="localdns-value">Value</label>
                <input id="localdns-value" name="value" type="text" autocomplete="off" required>
              </div>
              <div>
                <label for="localdns-ttl">TTL</label>
                <input id="localdns-ttl" name="ttl" type="number" min="0" max="604800" step="1" value="300">
              </div>
              <label class="checkbox-line" for="localdns-enabled">
                <input id="localdns-enabled" name="enabled" type="checkbox" checked>
                Enabled
              </label>
              <div>
                <label for="localdns-comment">Comment</label>
                <input id="localdns-comment" name="comment" type="text" autocomplete="off">
              </div>
              <button id="localdns-save" type="submit">Add record</button>
              <button id="localdns-cancel" class="secondary hidden" type="button">Cancel</button>
            </form>
          </div>

          <div id="localdns-message" class="status-line localdns-message" role="status" aria-live="polite"></div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Type</th>
                  <th>Value</th>
                  <th>TTL</th>
                  <th>Enabled</th>
                  <th>Comment</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="localdns-body">
                <tr><td colspan="7" class="loading">Loading custom DNS records...</td></tr>
              </tbody>
            </table>
          </div>
        </section>

        <section class="panel localdns-panel">
          <div class="panel-header">
            <h3>Rewrite rules</h3>
            <span id="rewrite-status">--</span>
          </div>

          <div class="localdns-controls">
            <form id="rewrite-form" class="control-box form-grid rewrite-form">
              <input id="rewrite-index" name="index" type="hidden">
              <div>
                <label for="rewrite-field">Field</label>
                <select id="rewrite-field" name="field">
                  <option value="name">Name</option>
                  <option value="type">Type</option>
                  <option value="ttl">TTL</option>
                  <option value="rcode">RCODE</option>
                </select>
              </div>
              <div>
                <label for="rewrite-mode">Mode</label>
                <select id="rewrite-mode" name="mode">
                  <option value="stop">Stop</option>
                  <option value="continue">Continue</option>
                </select>
              </div>
              <div data-rewrite-match-field>
                <label for="rewrite-match">Match</label>
                <select id="rewrite-match" name="match">
                  <option value="exact">Exact</option>
                  <option value="prefix">Prefix</option>
                  <option value="suffix">Suffix</option>
                  <option value="substring">Substring</option>
                  <option value="regex">Regex</option>
                </select>
              </div>
              <div>
                <label id="rewrite-from-label" for="rewrite-from">From</label>
                <input id="rewrite-from" name="from" type="text" autocomplete="off" required>
              </div>
              <div data-rewrite-to-field>
                <label id="rewrite-to-label" for="rewrite-to">To</label>
                <input id="rewrite-to" name="to" type="text" autocomplete="off">
              </div>
              <div data-rewrite-rcode-field class="hidden">
                <label for="rewrite-rcode-from">RCODE from</label>
                <select id="rewrite-rcode-from" name="rcode_from">
                  <option value="NOERROR">NOERROR</option>
                  <option value="SERVFAIL">SERVFAIL</option>
                  <option value="NXDOMAIN">NXDOMAIN</option>
                  <option value="REFUSED">REFUSED</option>
                </select>
              </div>
              <div data-rewrite-rcode-field class="hidden">
                <label for="rewrite-rcode-to">RCODE to</label>
                <select id="rewrite-rcode-to" name="rcode_to">
                  <option value="NOERROR">NOERROR</option>
                  <option value="SERVFAIL">SERVFAIL</option>
                  <option value="NXDOMAIN">NXDOMAIN</option>
                  <option value="REFUSED">REFUSED</option>
                </select>
              </div>
              <div data-rewrite-answer-field>
                <label for="rewrite-answer-mode">Answer rewrite</label>
                <select id="rewrite-answer-mode" name="answer_mode">
                  <option value="none">None</option>
                  <option value="auto">Auto</option>
                  <option value="name">Answer name</option>
                  <option value="value">Answer value</option>
                </select>
              </div>
              <div data-rewrite-answer-detail class="hidden">
                <label for="rewrite-answer-from">Answer from</label>
                <input id="rewrite-answer-from" name="answer_from" type="text" autocomplete="off">
              </div>
              <div data-rewrite-answer-detail class="hidden">
                <label for="rewrite-answer-to">Answer to</label>
                <input id="rewrite-answer-to" name="answer_to" type="text" autocomplete="off">
              </div>
              <label class="checkbox-line" for="rewrite-enabled">
                <input id="rewrite-enabled" name="enabled" type="checkbox" checked>
                Enabled
              </label>
              <div>
                <label for="rewrite-comment">Comment</label>
                <input id="rewrite-comment" name="comment" type="text" autocomplete="off">
              </div>
              <button id="rewrite-save" type="submit">Add rewrite</button>
              <button id="rewrite-cancel" class="secondary hidden" type="button">Cancel</button>
            </form>
          </div>

          <div id="rewrite-message" class="status-line localdns-message" role="status" aria-live="polite"></div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Field</th>
                  <th>Match</th>
                  <th>From</th>
                  <th>To</th>
                  <th>Answer</th>
                  <th>Status</th>
                  <th>Comment</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="rewrite-body">
                <tr><td colspan="8" class="loading">Loading rewrite rules...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
        </section>
{{end}}
