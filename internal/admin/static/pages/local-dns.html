{{define "page.local-dns"}}
        <section id="panel-local-dns" class="page-panel" data-page="local-dns">
        <section class="panel localdns-panel">
          <div class="panel-header">
            <h3>Local DNS</h3>
            <span id="localdns-status">--</span>
          </div>

          <div class="localdns-controls">
            <form id="localdns-form" class="control-box form-grid localdns-form">
              <input id="localdns-id" name="id" type="hidden">
              <div>
                <label for="localdns-name">Name</label>
                <input id="localdns-name" name="name" type="text" autocomplete="off" required>
              </div>
              <div>
                <label for="localdns-type">Type</label>
                <select id="localdns-type" name="type">
                  <option value="A">A</option>
                  <option value="AAAA">AAAA</option>
                  <option value="CNAME">CNAME</option>
                  <option value="PTR">PTR</option>
                </select>
              </div>
              <div>
                <label for="localdns-value">Value</label>
                <input id="localdns-value" name="value" type="text" autocomplete="off" required>
              </div>
              <div>
                <label for="localdns-ttl">TTL</label>
                <input id="localdns-ttl" name="ttl" type="number" min="0" max="604800" step="1" value="300">
              </div>
              <label class="checkbox-line" for="localdns-enabled">
                <input id="localdns-enabled" name="enabled" type="checkbox" checked>
                Enabled
              </label>
              <div>
                <label for="localdns-comment">Comment</label>
                <input id="localdns-comment" name="comment" type="text" autocomplete="off">
              </div>
              <button id="localdns-save" type="submit">Add record</button>
              <button id="localdns-cancel" class="secondary hidden" type="button">Cancel</button>
            </form>
          </div>

          <div id="localdns-message" class="status-line localdns-message" role="status" aria-live="polite"></div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Type</th>
                  <th>Value</th>
                  <th>TTL</th>
                  <th>Enabled</th>
                  <th>Comment</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="localdns-body">
                <tr><td colspan="7" class="loading">Loading local DNS records...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
        </section>
{{end}}
