{{define "page.clients-groups"}}
        <section id="panel-clients-groups" class="page-panel page-stack" data-page="clients-groups">
        <section class="panel management-panel">
          <div class="panel-header">
            <h3>Clients</h3>
            <span id="client-status">--</span>
          </div>

          <form id="client-form" class="control-box client-form-grid">
            <input id="client-id" name="id" type="hidden">
            <div>
              <label for="client-address">Address</label>
              <input id="client-address" name="address" type="text" list="client-suggestions" autocomplete="off" required>
              <datalist id="client-suggestions"></datalist>
            </div>
            <div>
              <label for="client-name">Name</label>
              <input id="client-name" name="name" type="text" autocomplete="off" required>
            </div>
            <div>
              <label for="client-comment">Comment</label>
              <input id="client-comment" name="comment" type="text" autocomplete="off">
            </div>
            <label class="checkbox-line" for="client-enabled">
              <input id="client-enabled" name="enabled" type="checkbox" checked>
              Enabled
            </label>
            <button id="client-save" type="submit">Add client</button>
            <button id="client-cancel" class="secondary hidden" type="button">Cancel</button>
          </form>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Address</th>
                  <th>Name</th>
                  <th>Status</th>
                  <th>Comment</th>
                  <th>Groups</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="client-body">
                <tr><td colspan="6" class="loading">Loading clients...</td></tr>
              </tbody>
            </table>
          </div>
        </section>

        <section class="panel management-panel">
          <div class="panel-header">
            <h3>Groups</h3>
            <span id="group-status">--</span>
          </div>

          <form id="group-form" class="control-box group-form-grid">
            <input id="group-id" name="id" type="hidden">
            <div>
              <label for="group-name">Name</label>
              <input id="group-name" name="name" type="text" autocomplete="off" required>
            </div>
            <div>
              <label for="group-comment">Comment</label>
              <input id="group-comment" name="comment" type="text" autocomplete="off">
            </div>
            <label class="checkbox-line" for="group-enabled">
              <input id="group-enabled" name="enabled" type="checkbox" checked>
              Enabled
            </label>
            <button id="group-save" type="submit">Add group</button>
            <button id="group-cancel" class="secondary hidden" type="button">Cancel</button>
          </form>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Status</th>
                  <th>Comment</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="group-body">
                <tr><td colspan="4" class="loading">Loading groups...</td></tr>
              </tbody>
            </table>
          </div>
        </section>
        </section>
{{end}}
